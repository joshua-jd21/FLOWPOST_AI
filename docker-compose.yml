version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: flowpost-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowpost-app
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
